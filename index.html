<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball_ScoreBoard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="container">
        <div class="sub_container">
        <div class="home">
        <h2>Home</h2>
        <h2 class="nums" id="score1"> 00</h2>
        </div>
        <div class="guest">
        <h2 >Guest</h2>
        <h2 class="nums" id="score2"> 00</h2>

        </div>
        </div>
        <div class="sub2" style="display: flex; justify-content: space-around;">
            <div class="team1" style="display: flex; justify-content:space-around ; gap: 10px;">
            <button class="but" onclick="add_team1_1()">+1</button>
            <button class="but" onclick="add_team1_2()">+2</button>
            <button class="but" onclick="add_team1_3()">+3</button>
            </div>
             <div><button onclick="reset()" style="background-color: aqua;width: 50px;height: 100%; ">Reset</button> </div>

            <div class="team2"  style="display: flex;justify-content:space-around ; gap: 10px;">
             <button class="but" onclick="add_team2_1()" >+1</button>
            <button class="but" onclick="add_team2_2()" >+2</button>
            <button class="but" onclick="add_team2_3()">+3</button>
            </div>
        </div>
        

    </div>
    <script src="script.jss"></script>
</body>
</html>
